  <script>
    /* Tim bay */
    (function(window, document){
      const hearts=[];
      function createHeart(e){
        const heart=document.createElement("div");
        heart.className="heart";
        hearts.push({el:heart,x:e.clientX-5,y:e.clientY-5,scale:1,alpha:1,color:`rgb(${Math.random()*255},${Math.random()*255},${Math.random()*255})`});
        document.body.appendChild(heart);
      }
      function animate(){
        for(let i=0;i<hearts.length;i++){
          const h=hearts[i];
          if(h.alpha<=0){document.body.removeChild(h.el);hearts.splice(i,1);continue;}
          h.y--;h.scale+=0.004;h.alpha-=0.013;
          h.el.style.cssText=`left:${h.x}px;top:${h.y}px;opacity:${h.alpha};transform:scale(${h.scale}) rotate(45deg);background:${h.color};z-index:99999`;
        }
        requestAnimationFrame(animate);
      }
      window.onclick=e=>createHeart(e);
      animate();
    })(window,document);

    /* Chạy số */
    function animateNumber(finalNumber,duration=4000,startNumber=0,callback){
      let currentNumber=startNumber;
      const interval=setInterval(()=>{
        if(currentNumber>=finalNumber){clearInterval(interval);}
        else{
          let inc=Math.ceil(finalNumber/(duration/17));
          if(currentNumber+inc>finalNumber){currentNumber=finalNumber;clearInterval(interval);}
          else{currentNumber+=inc;}
          callback(currentNumber);
        }
      },17);
    }
    document.addEventListener('DOMContentLoaded',function(){
      animateNumber(50000,4000,0,n=>document.getElementById('count-followers').innerText=n.toLocaleString());
      animateNumber(1,4000,0,n=>document.getElementById('count-following').innerText=n.toLocaleString());
      animateNumber(68,4000,0,n=>document.getElementById('count-posts').innerText=n.toLocaleString());
      animateNumber(2,4000,0,n=>document.getElementById('count-works').innerText=n.toLocaleString());
    });

    /* Tuyết rơi */
    const snowmax=40;const snowcolor=["#aaaacc","#ddddff","#ccccdd","#f3f3f3","#f0ffff"];
    const snowtype=["Times","Arial","Verdana"];const snowletter="*";const sinkspeed=0.6;
    const snowmaxsize=40;const snowminsize=8;const snowingzone=1;const snow=[];let marginbottom,marginright;
    const x_mv=[],crds=[],lftrght=[];
    function randommaker(range){return Math.floor(range*Math.random());}
    function initsnow(){
      marginbottom=document.body.scrollHeight;marginright=window.innerWidth-15;
      for(let i=0;i<=snowmax;i++){
        crds[i]=0;lftrght[i]=Math.random()*15;x_mv[i]=0.03+Math.random()/10;
        const snowflake=document.createElement("span");
        snowflake.className="snowflake";snowflake.id="s"+i;
        snowflake.style.fontFamily=snowtype[randommaker(snowtype.length)];
        snowflake.size=randommaker(snowmaxsize-snowminsize)+snowminsize;
        snowflake.style.fontSize=snowflake.size+"px";
        snowflake.style.color=snowcolor[randommaker(snowcolor.length)];
        snowflake.style.zIndex=1000;snowflake.sink=sinkspeed*snowflake.size/5;
        snowflake.posx=randommaker(marginright-snowflake.size);
        snowflake.posy=randommaker(2*marginbottom-2*snowflake.size);
        snowflake.style.left=snowflake.posx+"px";snowflake.style.top=snowflake.posy+"px";
        snowflake.innerHTML=snowletter;document.body.appendChild(snowflake);snow[i]=snowflake;
      }
      movesnow();
    }
    function movesnow(){
      for(let i=0;i<=snowmax;i++){
        crds[i]+=x_mv[i];snow[i].posy+=snow[i].sink;
        snow[i].style.left=snow[i].posx+lftrght[i]*Math.sin(crds[i])+"px";
        snow[i].style.top=snow[i].posy+"px";
        if(snow[i].posy>=marginbottom-2*snow[i].size){
          snow[i].posx=randommaker(marginright-snow[i].size);snow[i].posy=0;
        }
      }
      setTimeout(movesnow,50);
    }
    window.onload=initsnow;
  </script>
