<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trần Hào Dev</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}

body{
  background:#020202;
  color:#fff;
  overflow-x:hidden;
}

/* nền hiệu ứng */
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:
  radial-gradient(circle at 20% 20%, rgba(0,255,255,.15), transparent 40%),
  radial-gradient(circle at 80% 80%, rgba(140,0,255,.15), transparent 40%);
  animation:move 10s infinite alternate;
  z-index:-1;
}
@keyframes move{
  0%{transform:translateY(0)}
  100%{transform:translateY(-40px)}
}

/* container */
.container{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

/* card */
.card{
  background:rgba(10,10,15,.85);
  border:1px solid rgba(255,255,255,.08);
  border-radius:30px;
  padding:30px;
  backdrop-filter:blur(15px);
  box-shadow:0 0 50px rgba(0,255,255,.08);
}

/* avatar */
.avatar{
  width:180px;
  height:180px;
  border-radius:50%;
  padding:4px;
  background:linear-gradient(135deg,#00f5ff,#8a2eff);
  margin:auto;
}
.avatar img{
  width:100%;
  height:100%;
  border-radius:50%;
  border:4px solid #000;
}

/* name */
h1{
  text-align:center;
  font-size:50px;
  margin-top:20px;
  background:linear-gradient(90deg,#fff,#00f5ff,#a66bff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* typing */
.typing{
  text-align:center;
  margin-top:10px;
  color:#aaa;
  font-size:18px;
}

/* skills */
.skills{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
  margin-top:30px;
}
.skill{
  padding:18px;
  border-radius:18px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  text-align:center;
  transition:.3s;
}
.skill:hover{
  transform:translateY(-5px);
  border-color:#00f5ff;
  box-shadow:0 0 20px rgba(0,255,255,.2);
}
.skill i{
  font-size:28px;
  color:#00f5ff;
  margin-bottom:10px;
}

/* social */
.socials{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}
.social{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px;
  border-radius:15px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  text-decoration:none;
  color:#fff;
  transition:.3s;
}
.social:hover{
  background:rgba(0,255,255,.1);
  transform:translateY(-5px);
}
.social i{
  font-size:20px;
}

/* button */
.btn{
  display:block;
  text-align:center;
  margin-top:25px;
  padding:12px;
  border-radius:12px;
  text-decoration:none;
  background:linear-gradient(135deg,#00f5ff,#8a2eff);
  font-weight:bold;
}

/* footer */
footer{
  text-align:center;
  margin-top:30px;
  color:#777;
}

/* mobile */
@media(max-width:600px){
  h1{font-size:35px}
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="avatar">
      <img src="https://i.imgur.com/INo9bAC.jpeg">
    </div>

    <h1>Trần Hào Dev</h1>
    <div class="typing" id="typing"></div>

    <div class="skills">
      <div class="skill"><i class="fab fa-html5"></i>HTML/CSS</div>
      <div class="skill"><i class="fab fa-js"></i>JavaScript</div>
      <div class="skill"><i class="fab fa-php"></i>PHP</div>
      <div class="skill"><i class="fab fa-python"></i>Python</div>
      <div class="skill"><i class="fas fa-database"></i>Database</div>
      <div class="skill"><i class="fas fa-robot"></i>Automation</div>
    </div>

    <div class="socials">
      <a class="social" href="#"><i class="fab fa-facebook"></i> Facebook</a>
      <a class="social" href="#"><i class="fas fa-phone"></i> Zalo</a>
      <a class="social" href="#"><i class="fab fa-telegram"></i> Telegram</a>
      <a class="social" href="#"><i class="fab fa-github"></i> GitHub</a>
      <a class="social" href="#"><i class="fab fa-tiktok"></i> TikTok</a>
    </div>

    <a href="#" class="btn">Liên hệ ngay</a>

    <footer>© 2026 Trần Hào Dev</footer>

  </div>
</div>

<script>
const text = ["Full Stack Developer","Tool Developer","Automation Expert","VNDEVCODE.COM"];
let i=0,j=0,current="",isDeleting=false;

function type(){
  if(i<text.length){
    if(!isDeleting && j<=text[i].length){
      current=text[i].substring(0,j++);
    }else if(isDeleting && j>=0){
      current=text[i].substring(0,j--);
    }

    document.getElementById("typing").innerHTML=current;

    if(j==text[i].length) isDeleting=true;
    if(j==0){isDeleting=false;i++}

    setTimeout(type,isDeleting?50:100);
  }else{
    i=0;
    setTimeout(type,500);
  }
}
type();
</script>

</body>
</html>
