<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trần Hào Dev - Profile V3</title>
  <meta content="Trần Hào Dev" property="og:title"/>
  <meta content="Xây dựng và phát triển bởi Trần Hào Dev !" property="og:description"/>
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrapper">
    <div class="profile-card js-profile-card">
      <div class="profile-card__img">
    <img src="https://i.imgur.com/vapX3oM.jpeg" alt="profile card"/>
</div>

      <div class="profile-card__cnt js-profile-cnt">
        <div class="profile-card__name">
          Trần Hào Dev
          <i class="fa fa-check-circle" style="color:rgb(17, 143, 249)" title="Verified Author"></i>
        </div>

        <div class="profile-card__txt">
          Mình là <b>Trần Hào Dev</b>, là một tân sinh viên năng động, có sở thích nghiên cứu và tìm tòi những thứ mới lạ, rất vui được làm quen với tất cả mọi người ...
        </div>

        <div class="profile-card-loc">
          <span class="profile-card-loc__icon">
            <svg class="icon"><use xlink:href="#icon-location"></use></svg>
          </span>
          <span class="profile-card-loc__txt">Bình Dương - Hồ Chí Minh</span>
        </div>

        <div id="key-display" class="key-display" style="display:none;"></div>

        <div class="profile-card-inf">
          <div class="profile-card-inf__item">
            <div class="profile-card-inf__title" id="count-followers">0</div>
            <div class="profile-card-inf__txt">Followers</div>
          </div>
          <div class="profile-card-inf__item">
            <div class="profile-card-inf__title" id="count-following">0</div>
            <div class="profile-card-inf__txt">Following</div>
          </div>
          <div class="profile-card-inf__item">
            <div class="profile-card-inf__title" id="count-posts">0</div>
            <div class="profile-card-inf__txt">Posts</div>
          </div>
          <div class="profile-card-inf__item">
            <div class="profile-card-inf__title" id="count-works">0</div>
            <div class="profile-card-inf__txt">Works</div>
          </div>
        </div>

        <div class="profile-card-social">
          <a class="profile-card-social__item facebook" href="https://www.facebook.com/haomilknn" target="_blank">
            <span class="icon-font"><svg class="icon"><use xlink:href="#icon-facebook"></use></svg></span>
          </a>

          <a class="profile-card-social__item zalo" href="https://zalo.me/0559705922" target="_blank">
            <span class="icon-font">
              <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Icon_of_Zalo.svg" alt="Zalo" style="width:24px;height:24px;vertical-align:middle;">
            </span>
          </a>

          <a class="profile-card-social__item twitter" href="https://t.me/Haomilknn07" target="_blank">
            <span class="icon-font"><svg class="icon"><use xlink:href="#icon-twitter"></use></svg></span>
          </a>

          <a class="profile-card-social__item github" href="https://www.youtube.com/@tranhaodev" target="_blank">
            <span class="icon-font"><svg class="icon"><use xlink:href="#icon-github"></use></svg></span>
          </a>

          <a class="profile-card-social__item link" href="https://zalo.me/g/vwntys580" target="_blank">
            <span class="icon-font"><svg class="icon"><use xlink:href="#icon-link"></use></svg></span>
          </a>
        </div>

        <div class="profile-card-ctr">
          <button class="profile-card__button button--blue js-message-btn">Message</button>
          <button class="profile-card__button button--orange" onclick="window.open('https://www.facebook.com/haomilknn')">Follow</button>
        </div>
      </div>

      <div class="profile-card-message js-message">
        <form class="profile-card-form">
          <div class="profile-card-form__container">
            <textarea placeholder="Cảm ơn bạn đã quan tâm. Hiện tại, tính năng này chưa khả dụng, vui lòng thử lại sau. Chúc bạn một ngày tốt lành !"></textarea>
          </div>
          <div class="profile-card-form__bottom">
            <button class="profile-card__button button--blue js-message-close">Send</button>
            <button class="profile-card__button button--gray js-message-close">Cancel</button>
          </div>
        </form>
        <div class="profile-card__overlay js-message-close"></div>
      </div>
    </div>
  </div>

  <!-- SVG Icons -->

    <defs>

      </symbol>
      <symbol id="icon-twitter" viewBox="0 0 32 32">
        <path d="M29.92 3.64c-0.35-0.29-0.85-0.34-1.27-0.15l-27.23 11.9c-0.52 0.23-0.86 0.71-0.89 1.28s0.28 1.07 0.77 1.34l7.04 3.84 2.73 6.75c0.18 0.45 0.62 0.75 1.11 0.76h0.01c0.49 0 0.94-0.29 1.13-0.74l3.49-8.38 7.97-7.94c0.34-0.34 0.44-0.86 0.26-1.31s-0.61-0.77-1.1-0.79l-17.3-0.99 20.85-7.03c0.42-0.14 0.75-0.45 0.85-0.86s-0.03-0.9-0.34-1.23z"></path>
      </symbol>
      <symbol id="icon-github" viewBox="0 0 32 32">

  </svg>

  <script src="script.js"></script>
</body>
</html>
